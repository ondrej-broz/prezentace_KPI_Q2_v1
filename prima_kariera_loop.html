  html,body{height:100%;}
  body{background:var(--dark);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  svg{width:min(86vw,820px);height:auto;display:block;}

  .wrap{transition:transform .56s cubic-bezier(.5,0,.2,1);}
  .ball,.fillp,.realp{transition:opacity .33s ease;}
  .strokep{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.3,1);}
  .wm{transition:opacity .47s ease;}
  .body{transition:height .53s cubic-bezier(.45,0,.2,1), y .53s cubic-bezier(.45,0,.2,1);}
  .typing #ball0{animation:bnc .87s infinite ease-in-out 0s;}
  .typing #ball1{animation:bnc .87s infinite ease-in-out .12s;}
  .typing #ball2{animation:bnc .87s infinite ease-in-out .24s;}
  @keyframes bnc{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-15px);}}
</style>

<script>
  const E=id=>document.getElementById(id);
  const w=[E('w0'),E('w1'),E('w2')], ball=[E('ball0'),E('ball1'),E('ball2')], bd=[E('bd0'),E('bd1'),E('bd2')];
  const sp=[E('s0'),E('s1'),E('s2')], fp=[E('f0'),E('f1'),E('f2')];
  const stage=E('msvg'), realp=E('realp'), wm=E('wm');

  // dash lengths for draw-on
  const LEN=sp.map(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; return L; });

  const LOGO=[[118,110],[278,110],[342,110]]; const LOGO_S=0.46;
  const ROW=[[132,110],[180,110],[228,110]];
  const PEOPLE=[[132,88],[180,88],[228,88]];
  const PNODE=[[138,67],[138,151],[222,95]];
  const TRI=[[180,74],[138,150],[222,150]];

  function place(a,s){ s=s||1; w.forEach((el,i)=>el.style.transform=`translate(${a[i][0]}px,${a[i][1]}px) scale(${s})`); }
  function bodies(h){ bd.forEach(r=>r.setAttribute('height',h)); }
  function balls(o){ ball.forEach(b=>b.style.opacity=o?1:0); }
  function fills(o){ fp.forEach(el=>el.style.opacity=o?1:0); }
  function draw(on){ sp.forEach((p,i)=>p.style.strokeDashoffset = on?0:LEN[i]); }
  function P_(o){ realp.style.opacity=o?1:0; }
  function WM(o){ wm.style.opacity=o?1:0; }
  function typing(o){ stage.classList.toggle('typing',o); }

  function s_logo(){ typing(false); bodies(0); fills(false); draw(false); P_(false); balls(true); WM(true); place(LOGO,LOGO_S); }
  function s_dots(){ WM(false); place(ROW,1); }
  function s_people(){ P_(false); place(PEOPLE,1); bodies(44); }
  function s_dots2(){ bodies(0); place(ROW,1); }
  function s_p(){ place(PNODE,1); P_(true); }
  function s_dots3(){ P_(false); place(ROW,1); }
  function s_typing(){ place(ROW,1); typing(true); }
  function s_dots4(){ typing(false); }
  function s_tri(){ fills(false); draw(false); balls(true); place(TRI,1); }
  function s_pinsDraw(){ balls(false); draw(true); }
  function s_pinsFill(){ fills(true); }
  function s_dots5(){ fills(false); draw(false); balls(true); place(TRI,1); }
  function s_rowback(){ place(ROW,1); }
  function s_logoEnd(){ place(LOGO,LOGO_S); WM(true); }

  const seq=[
    {t:0,f:s_logo},{t:1470,f:s_dots},{t:2600,f:s_people},{t:3730,f:s_dots2},
    {t:4870,f:s_p},{t:6130,f:s_dots3},{t:7270,f:s_typing},{t:8930,f:s_dots4},
    {t:9470,f:s_tri},{t:10400,f:s_pinsDraw},{t:11250,f:s_pinsFill},
    {t:12900,f:s_dots5},{t:13600,f:s_rowback},{t:14600,f:s_logoEnd},{t:16400,f:()=>{}}
  ];
  function play(){ seq.forEach(s=>setTimeout(s.f,s.t)); }
  s_logo();
  setTimeout(play,500);
  setInterval(play,16700);
</script>
